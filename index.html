<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/block-blog/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Blog</title>
    <script>
      // Apply the saved (or system-preferred) theme before React renders, so
      // there is no flash of the wrong theme on load.
      (function () {
        try {
          var stored = localStorage.getItem('block-blog-theme')
          var theme = stored
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          document.documentElement.setAttribute('data-bs-theme', theme)
        } catch (e) {}
      })()
    </script>
    <script type="module" crossorigin src="/block-blog/assets/index-DYNz4rdt.js"></script>
    <link rel="stylesheet" crossorigin href="/block-blog/assets/index-C98g7mVg.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
